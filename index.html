<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<meta charset="utf-8">
<title>India E-commerce Knowledge Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.77.0/dist/3d-force-graph.min.js"></script>
<style>
/* Layout: operator console. Top bar (views + play), left rail (find, filters, insights), centre stage (graph), right sheet (brief). Stacks on phones. */
:root{
  --bg:#F4F5F9; --panel:#FFFFFF; --ink:#181B2A; --muted:#5B6177; --line:#DCE0EA; --accent:#C2410C; --accent-soft:#FDE7DA;
  --t-hub:#181B2A; --t-platform:#3B4CCA; --t-sale:#C2410C; --t-strategy:#7C5CBF; --t-region:#0F766E;
  --t-state:#15803D; --t-city:#65A30D; --t-season:#D97706; --t-festival:#DB2777; --t-category:#2563EB; --t-signal:#0E7490;
  --edge:#AEB5C8; --edge-hot:#C2410C; --wheel:#E7EAF2; --halo:#F4F5F9;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F111C; --panel:#171A29; --ink:#E9EBF5; --muted:#A0A6BC; --line:#2A2F45; --accent:#FB923C; --accent-soft:#3A2416;
  --t-hub:#E9EBF5; --t-platform:#8C9BFF; --t-sale:#FB923C; --t-strategy:#B79CF2; --t-region:#2DD4BF;
  --t-state:#4ADE80; --t-city:#A3E635; --t-season:#FBBF24; --t-festival:#F472B6; --t-category:#60A5FA; --t-signal:#22D3EE;
  --edge:#3A4160; --edge-hot:#FB923C; --wheel:#22273A; --halo:#0F111C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F111C; --panel:#171A29; --ink:#E9EBF5; --muted:#A0A6BC; --line:#2A2F45; --accent:#FB923C; --accent-soft:#3A2416;
  --t-hub:#E9EBF5; --t-platform:#8C9BFF; --t-sale:#FB923C; --t-strategy:#B79CF2; --t-region:#2DD4BF;
  --t-state:#4ADE80; --t-city:#A3E635; --t-season:#FBBF24; --t-festival:#F472B6; --t-category:#60A5FA; --t-signal:#22D3EE;
  --edge:#3A4160; --edge-hot:#FB923C; --wheel:#22273A; --halo:#0F111C; color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:290px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 12px;border:0;background:var(--panel);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.play{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.link:focus-visible,input:focus-visible,.month:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.months{display:flex;gap:2px}
.month{font-family:var(--f-mono);font-size:11px;width:28px;padding:5px 0;text-align:center;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.month[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.statebar{flex-basis:100%;display:flex;align-items:center;gap:8px;min-width:0}
.statebar .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:none}
.states{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;min-width:0;scrollbar-width:thin}
.st{flex:none;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
.st .sh{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.st[aria-pressed="true"]{background:var(--t-state);border-color:var(--t-state);color:var(--bg)}
.st[aria-pressed="true"] .sh{color:var(--bg)}
.st:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.st.lit{border-color:var(--accent)}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sec h2{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
input.search{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="false"]{opacity:.4}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.ins{display:flex;flex-direction:column;gap:8px}
.ins .card{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--bg)}
.ins .big{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.ins .txt{font-size:12.5px}
.ins .tag{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
main{position:relative;min-width:0;min-height:0;overflow:hidden}
svg#stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
svg#stage:active{cursor:grabbing}
.link{fill:none;stroke:var(--edge);stroke-width:.8;opacity:.5;transition:opacity .35s,stroke .35s,stroke-width .35s}
.link.hot{stroke:var(--edge-hot);stroke-width:1.8;opacity:.95;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link.dim{opacity:.06}
@keyframes flow{to{stroke-dashoffset:-22}}
.node circle{stroke:var(--halo);stroke-width:1.5;transition:opacity .35s, r .35s}
.node text{font-family:var(--f-body);font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;transition:opacity .35s}
.node.major text{font-size:12.5px;font-weight:600}
.node.minor text{opacity:0}
svg.zoomed .node.minor text,.node.minor.hot text,.node.minor.sel text,.node.minor.nb text{opacity:1}
.node.dim circle{opacity:.12}.node.dim text{opacity:.12}
.node.hot circle{stroke:var(--edge-hot);stroke-width:2.5}
.node.sel circle{stroke:var(--ink);stroke-width:3}
.pulse{fill:none;stroke:var(--edge-hot);stroke-width:2;opacity:0}
.node.hot .pulse{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.wheel circle{fill:none;stroke:var(--wheel);stroke-width:1}
.wheel text{font-family:var(--f-mono);font-size:11px;fill:var(--muted);text-anchor:middle}
.wheel .hand{stroke:var(--accent);stroke-width:2;opacity:.8}
.wheel .wedge{fill:var(--accent);opacity:.07}
.ringlbl{font-family:var(--f-body);font-size:10px;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.overlay{position:absolute;left:12px;bottom:12px;max-width:min(420px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.overlay h3{font-family:var(--f-display);font-weight:800;font-size:17px;margin:0 0 4px}
.overlay .row{font-size:12.5px;margin:2px 0}
.overlay .k{color:var(--muted)}
.tools{position:absolute;right:12px;top:12px;display:flex;gap:6px}
#detail{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px 18px;min-width:0}
.d-type{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.d-name{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.12;margin:4px 0 6px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--bg);min-width:70px}
.kpi b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted)}
.d-info{margin:6px 0}
.d-src{font-size:12px;color:var(--muted);margin-bottom:12px}
.brief{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0 14px}
.brief h4{margin:0 0 6px;font-family:var(--f-display);font-size:14px}
.brief ul{margin:0;padding-left:18px}.brief li{margin:2px 0;font-size:13px}
.brief .note{font-size:11px;color:var(--muted);margin-top:6px}
.rels{display:flex;flex-direction:column;gap:4px}
.rel{font-size:13px;padding:5px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.rel .verb{color:var(--muted)}
.lnk{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--accent)}
.empty{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.pill.p3{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.p2{border-color:var(--accent);color:var(--accent)}
.culture{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:6px 0 10px;padding:9px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.culture .k,.fg .mon,.row .k{color:var(--muted)}
.culture a,.fg-n a,.brief a,.evid a{color:var(--accent)}
.fguide{display:flex;flex-direction:column;gap:6px}
.fg{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg)}
.fg-h{font-size:13px}
.fg.off{opacity:.4}
.planline{fill:none;stroke:var(--accent);stroke-dasharray:2 6;stroke-linecap:round;opacity:.95;animation:flow 1s linear infinite}

#g3d{position:absolute;inset:0}
.labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.l3{position:absolute;left:0;top:0;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 3px var(--bg)}
.l3 i{font-style:normal;font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.l3.sel{color:var(--accent);font-size:13.5px}
.fg-d{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin:2px 0 3px}
.fg-d .cf{color:var(--muted)}
.base{transition:opacity .45s}
svg.flowmode .base{opacity:.04;pointer-events:none}
.flow .f-link{fill:none;stroke-linecap:round;opacity:.55;transition:opacity .2s}
.flow .f-link.hold{stroke-dasharray:4 5}
.flow .f-node{cursor:pointer}
.flow .f-node circle{stroke:var(--halo);stroke-width:2}
.flow .f-node text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.flow .f-node .sub{font-size:11px;fill:var(--muted)}
.flow .f-node:hover text{text-decoration:underline}
.flow .f-head{font-family:var(--f-body);font-size:10.5px;font-weight:600;letter-spacing:.09em;fill:var(--muted);text-transform:uppercase}
.flow .f-title{font-family:var(--f-display);font-weight:800;font-size:26px;fill:var(--ink)}
.flow .f-sub{font-family:var(--f-body);font-size:13px;fill:var(--muted)}
.flow .f-col{font-family:var(--f-display);font-weight:600;font-size:14px;fill:var(--accent)}
.flow .f-col.hold{fill:var(--t-festival)}
svg.flowmode .flow .f-link.dimmed{opacity:.08}
.planline.hold{stroke:var(--t-festival);stroke-dasharray:1 5;opacity:.8}
.brief.plan h4{font-size:15px}
ol.push{margin:4px 0 6px;padding-left:20px}
ol.push li{font-size:13px;margin:3px 0}
ol.push .why{color:var(--muted);font-size:12px}
.watch{color:var(--t-festival)}
.board{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bd{display:flex;gap:9px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer}
.bd:hover{border-color:var(--accent)}
.bd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bd .rk{font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--accent);min-width:20px;font-variant-numeric:tabular-nums}
.bd-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.bd-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bd .mon{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bd-why{font-size:12px;color:var(--muted)}
.drivers{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.drivers .k{color:var(--muted)}
.drivers .mon{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.pill.hold{border-color:var(--t-festival);color:var(--t-festival)}
.cards{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.sigcard{display:flex;flex-direction:column;gap:1px;font-size:12.5px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel);border-left:3px solid var(--accent)}
.sigcard.hold{border-left-color:var(--t-festival)}
.sigcard .act{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--accent)}
.sigcard.hold .act{color:var(--t-festival)}
.sigcard .cb{color:var(--muted);font-size:12px}
.btn.copy{margin-top:8px;font-size:12px}
.copybox{width:100%;height:120px;margin-top:6px;font-family:var(--f-mono);font-size:11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}

.fg .mon{font-family:var(--f-mono);font-size:11px;margin-left:6px}
.fg-b{font-size:12.5px;margin-top:2px}
.fg-n{font-size:11.5px;color:var(--muted);margin-top:2px}
.evid{display:flex;flex-direction:column;gap:7px}
.evid .e{font-size:12px;border-left:2px solid var(--accent);padding:2px 0 2px 8px}
.evid .who{color:var(--muted);font-size:11px}
@media (max-width:1150px){ .app{grid-template-columns:260px minmax(0,1fr)} #detail{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:40vh} }
@media (max-width:760px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  main{height:72vh;min-height:440px}
  #detail{max-height:none}
  .play{margin-left:0;flex-wrap:wrap}
  .months{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){ .link.hot,.node.hot .pulse{animation:none} *{transition:none!important} }
</style>

<div class="app">
  <header>
    <h1>India E-commerce Knowledge Graph</h1>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="v-net" aria-pressed="true">Network</button>
      <button type="button" id="v-wheel" aria-pressed="false">Year wheel</button>
      <button type="button" id="v-3d" aria-pressed="false">3D</button>
    </div>
    <div class="play">
      <button type="button" class="btn primary" id="playBtn">&#9654; Play the year</button>
      <div class="months" id="months" role="group" aria-label="Month"></div>
    </div>
    <span class="meta" id="meta"></span>
    <div class="statebar"><span class="lbl">States</span><div class="states" id="states" role="group" aria-label="States, largest share first"></div></div>
  </header>

  <aside>
    <div class="sec">
      <h2><label for="search">Find</label></h2>
      <input id="search" class="search" list="names" placeholder="State, festival, platform&#x2026;" autocomplete="off">
      <datalist id="names"></datalist>
    </div>
    <div class="sec">
      <h2>Show</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="sec">
      <h2>Festivals by online impact</h2>
      <div class="chips" id="impChips"></div>
    </div>
    <div class="sec">
      <h2>What the data says</h2>
      <div class="ins" id="insights"></div>
    </div>
    <div class="sec">
      <h2>Market evidence</h2>
      <div class="evid" id="evidence"></div>
    </div>
  </aside>

  <main>
    <div id="g3d" hidden></div><div id="g3dLabels" class="labels3d" hidden></div>
    <svg id="stage" role="img" aria-label="Animated knowledge graph of Indian e-commerce: platforms, regions, states, seasons, festivals and product categories"></svg>
    <div class="tools"><button type="button" class="btn" id="fit">Fit</button><button type="button" class="btn" id="clear">Clear</button></div>
    <div class="overlay" id="overlay" hidden></div>
  </main>

  <section id="detail" aria-live="polite"></section>
</div>

<script>
"use strict";
/* =========================================================================
   1. DATA  (transcribed from the notes; months for festivals = typical dates)
   ========================================================================= */
const SRC={p1:"Notes, 26 Sep",p2:"Notes, 30 Sep",p3:"Notes, 1 Oct",p4:"Notes, 2 Oct",p5:"Notes, 3 Oct",p6:"Notes, 4 Oct",p7:"Notes, 6 Oct",p8:"Notes, 7 Oct"};
const TYPES={hub:["Topic","--t-hub"],platform:["Platform","--t-platform"],sale:["Sale / campaign","--t-sale"],strategy:["Strategy","--t-strategy"],
  region:["Region","--t-region"],state:["State","--t-state"],city:["City","--t-city"],season:["Season","--t-season"],festival:["Festival","--t-festival"],category:["Product","--t-category"],signal:["Demand signal","--t-signal"]};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const N=[],E=[];
const n=(id,label,type,o={})=>N.push({id,label,type,info:o.info||"",src:o.src||"",share:o.share||null,months:o.months||[]});
const e=(a,rel,b)=>E.push({source:a,target:b,rel});

n("india","Indian e-commerce","hub",{info:"The market described in the notes."});
const P=[["amazon","Amazon","Location strategy: services in regional languages and empowering small businesses.","p1"],
 ["flipkart","Flipkart","Annual Big Billion Days sale: massive revenues and the driver of festive shopping.","p1"],
 ["myntra","Myntra","End of Reason Sale is a crowd-puller; leader in fashion e-commerce.","p1"],
 ["snapdeal","Snapdeal","Bolstered rural economies by connecting local artisans with a wider audience.","p1"],
 ["paytm","Paytm Mall","Festive cashback campaigns drove significant traffic and sales.","p1"],
 ["tatacliq","Tata CLiQ","Authentic and luxury products; resonates with premium shoppers.","p2"],
 ["ajio","Ajio","Growth from targeted marketing campaigns and strategic brand collaborations.","p2"],
 ["bigbasket","BigBasket","Innovative delivery models; benchmark in online grocery, especially Tier 1 cities.","p2"],
 ["nykaa","Nykaa","2021 IPO cemented its leadership in the beauty segment.","p2"]];
P.forEach(([id,l,i,s])=>{n(id,l,"platform",{info:i,src:s});e(id,"is a platform in","india");});
n("bbd","Big Billion Days","sale",{info:"Flipkart's mega-sale; anchors the main festive wave.",src:"p1",months:[9,10]});

const pct=s=>{if(!s)return 0;const m=String(s).match(/[\d.]+/g);return m?Math.max(...m.map(Number)):0;};
const out=id=>E.filter(l=>l.source===id||l.source.id===id);
const inn=id=>E.filter(l=>l.target===id||l.target.id===id);
const sid=x=>typeof x==="object"?x.id:x;
const neighbours=id=>{const s=new Set([id]);E.forEach(l=>{if(sid(l.source)===id)s.add(sid(l.target));if(sid(l.target)===id)s.add(sid(l.source));});return s;};
const seasonsIn=m=>N.filter(d=>d.type==="season"&&d.months.includes(m));
const catsOfSeason=s=>E.filter(l=>sid(l.source)===s&&l.rel==="drives sales of").map(l=>sid(l.target));
const festsOfState=s=>E.filter(l=>sid(l.target)===s&&l.rel==="is big in").map(l=>byId.get(sid(l.source)));
const statesOfFest=f=>E.filter(l=>sid(l.source)===f&&l.rel==="is big in").map(l=>sid(l.target));
const stateRegion=s=>{const l=E.find(l=>sid(l.source)===s&&l.rel==="is in");return l?byId.get(sid(l.target)):null;};

function monthActive(m){
  const act=new Set(["india"]);
  N.forEach(d=>{if(d.months.includes(m))act.add(d.id);});
  seasonsIn(m).forEach(s=>catsOfSeason(s.id).forEach(c=>act.add(c)));
  N.filter(d=>d.type==="festival"&&d.months.includes(m)).forEach(f=>statesOfFest(f.id).forEach(s=>act.add(s)));
  return act;
}
function monthBrief(m){
  const fests=N.filter(d=>d.type==="festival"&&d.months.includes(m));
  const seasons=seasonsIn(m).filter(s=>s.id!=="peak");
  const cats=[...new Set(seasons.flatMap(s=>catsOfSeason(s.id)))].map(c=>byId.get(c).label);
  const states=[...new Set(fests.flatMap(f=>statesOfFest(f.id)))].map(s=>byId.get(s)).sort((a,b)=>pct(b.share)-pct(a.share));
  const sales=N.filter(d=>d.type==="sale"&&d.months.includes(m));
  const cnt=new Map();     // what this month's festivals make people buy, weighted by e-commerce impact
  fests.filter(f=>f.impact>=2).forEach(f=>E.forEach(l=>{ if(sid(l.source)===f.id&&l.rel==="people buy"){const c=sid(l.target);cnt.set(c,(cnt.get(c)||0)+f.impact);} }));
  const buys=[...cnt].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c])=>byId.get(c).label);
  fests.sort((a,b)=>b.impact-a.impact);
  return {fests,seasons,cats,states,sales,buys,peak:byId.get("peak").months.includes(m)};
}
function stateBrief(id){
  const fs=festsOfState(id).filter(f=>f.months.length);
  const months=[...new Set(fs.flatMap(f=>f.months))].sort((a,b)=>((a+3)%12)-((b+3)%12)); // fiscal-style order from Apr
  const plan=months.map(m=>{const f=fs.filter(x=>x.months.includes(m)).map(x=>x.label);
    const c=[...new Set(seasonsIn(m).filter(s=>s.id!=="peak").flatMap(s=>catsOfSeason(s.id)))].map(x=>byId.get(x).label);return {m,f,c};});
  const ranked=N.filter(d=>d.type==="state"&&d.share).sort((a,b)=>pct(b.share)-pct(a.share));
  const rank=ranked.findIndex(d=>d.id===id)+1;
  const total=ranked.reduce((s,d)=>s+pct(d.share),0);
  return {plan,rank,ofRanked:ranked.length,weight:pct(byId.get(id).share)?(pct(byId.get(id).share)/total*100):null};
}

/* ---------- Month planner: which state to target, what to push, and why ---------- */
const IMPW={high:3,medium:2,low:1};
function signalsFor(stId,m){
  return N.filter(d=>d.type==="signal"&&d.months.includes(m)&&(d.national||d.states.includes(stId)));
}
function monthPlan(stId,m){
  const s=byId.get(stId);
  const fs=E.filter(l=>sid(l.target)===stId&&l.rel==="is big in")
    .map(l=>({f:byId.get(sid(l.source)),meta:l.meta})).filter(x=>x.f.months.includes(m))
    .map(x=>({...x,w:x.meta?IMPW[x.meta.i]:x.f.impact})).sort((a,b)=>b.w-a.w);
  const sigs=signalsFor(stId,m).sort((a,b)=>(b.national?0:1)-(a.national?0:1)||b.str-a.str);
  const val=new Map(),why=new Map(),hold=new Map(),holdWhy=new Map(),ids=new Map();
  const add=(map,wmap,c,v,reason,rid,neg)=>{map.set(c,(map.get(c)||0)+v);if(!wmap.has(c))wmap.set(c,[]);if(!wmap.get(c).includes(reason))wmap.get(c).push(reason);
    const k=(neg?"-":"+")+c; if(!ids.has(k))ids.set(k,new Map()); ids.get(k).set(rid,(ids.get(k).get(rid)||0)+v);};
  fs.forEach(x=>{ const cs=x.meta?x.meta.c:E.filter(l=>sid(l.source)===x.f.id&&l.rel==="people buy").map(l=>sid(l.target));
    cs.forEach(c=>add(val,why,c,x.w*2,`${x.f.label} (festival)`,x.f.id)); });
  seasonsIn(m).filter(se=>se.id!=="peak").forEach(se=>catsOfSeason(se.id).forEach(c=>add(val,why,c,1.5,`${se.label} (season)`,se.id)));
  sigs.forEach(g=>{ const w=g.str*(g.national?1:2), r=`${g.label} (${(SIGTYPE[g.stype]||"signal").toLowerCase()})`;
    g.cats.forEach(c=>g.dir>0?add(val,why,c,w,r,g.id):add(hold,holdWhy,c,w,r,g.id,true)); });
  const srcOf=k=>[...(ids.get(k)||new Map())].map(([id,v])=>({id,v})).sort((a,b)=>b.v-a.v);
  const pushes=[...val].map(([c,v])=>({c,v:v-(hold.get(c)||0),why:why.get(c),watch:holdWhy.get(c)||null,from:srcOf("+"+c)})).filter(x=>x.v>0)
    .sort((a,b)=>b.v-a.v).slice(0,7);
  // a hold only counts as "hold" when it outweighs the reasons to push; otherwise it becomes a "watch" note on the push
  const holds=[...hold].filter(([c,v])=>v>=(val.get(c)||0)).sort((a,b)=>b[1]-a[1]).map(([c,v])=>({c,v,why:holdWhy.get(c),from:srcOf("-"+c)}));
  const festW=d3.sum(fs,x=>x.w), localW=d3.sum(sigs.filter(g=>!g.national),g=>g.dir>0?g.str:-g.str/2);
  const share=pct(s.share)||0.6, peak=byId.get("peak").months.includes(m);
  return {s,fs,sigs,pushes,holds,festW,localW,share,known:!!s.share,peak,score:share*Math.max(.3,1+festW+localW)*(peak?1.3:1)};
}
const boardCache=new Map();
function board(m){
  if(!boardCache.has(m)) boardCache.set(m,N.filter(d=>d.type==="state").map(d=>monthPlan(d.id,m)).sort((a,b)=>b.score-a.score));
  return boardCache.get(m);
}

/* =========================================================================
   3. STAGE (D3 force + wheel layouts, animated transitions)
   ========================================================================= */
const svg=d3.select("#stage");
const stageEl=document.getElementById("stage");
let W=stageEl.clientWidth||900,H=stageEl.clientHeight||640;
const root=svg.append("g");
const wheelG=root.append("g").attr("class","wheel").style("opacity",0);
const linkG=root.append("g").attr("class","base");
const planG=root.append("g").attr("class","base");        // dashed "target -> push" lines for the month planner
const nodeG=root.append("g").attr("class","base");
const flowG=root.append("g").attr("class","flow");   // clean left-to-right "why -> push" diagram shown in month mode
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

const radius=d=>d.type==="hub"?24:d.type==="state"?(7+pct(d.share)*1.25):d.type==="region"?(13+pct(d.share)*.22):
  d.type==="platform"?13:d.type==="season"?(d.id==="peak"?17:12):d.type==="sale"?10:7.5;
const isMajor=d=>["hub","platform","region","season"].includes(d.type)||(d.type==="state"&&pct(d.share)>=5)||d.id==="diwali";

const linkSel=linkG.selectAll("path").data(E).join("path").attr("class","link");
const nodeSel=nodeG.selectAll("g").data(N,d=>d.id).join("g")
  .attr("class",d=>"node "+(isMajor(d)?"major":"minor")).attr("tabindex",0).attr("role","button")
  .attr("aria-label",d=>`${d.label}, ${TYPES[d.type][0]}`);
nodeSel.append("circle").attr("class","pulse").attr("r",radius);
nodeSel.append("circle").attr("class","core").attr("r",0).style("fill",d=>`var(${TYPES[d.type][1]})`);
nodeSel.append("text").attr("dy",d=>radius(d)+12).attr("text-anchor","middle")
  .text(d=>d.share&&(d.type==="state"||d.type==="region")?`${d.label} \u00b7 ${d.share}`:d.label);
nodeSel.select(".pulse").style("transform-box","fill-box").style("transform-origin","center");

// entrance animation: grow in by type order
const order=["hub","region","platform","season","state","festival","category","sale","strategy","city"];
nodeSel.select(".core").transition().delay(d=>reduce?0:order.indexOf(d.type)*140+Math.random()*120).duration(reduce?0:600)
  .ease(d3.easeBackOut.overshoot(1.6)).attr("r",radius);

// force layout
// "people buy" links are only drawn on focus, so they stay out of the physics; resolve their ends by hand
E.forEach(l=>{ if(l.soft){ l.source=byId.get(sid(l.source)); l.target=byId.get(sid(l.target)); } });
const hardDeg=new Map(); E.filter(l=>!l.soft).forEach(l=>[sid(l.source),sid(l.target)].forEach(k=>hardDeg.set(k,(hardDeg.get(k)||0)+1)));
const sim=d3.forceSimulation(N)
  .force("link",d3.forceLink(E.filter(l=>!l.soft)).id(d=>d.id).distance(l=>{const t=sid(l.target);return t==="india"?170:l.rel==="is big in"?80:60;}).strength(.5))
  .force("charge",d3.forceManyBody().strength(d=>d.type==="hub"?-1100:d.type==="platform"||d.type==="region"?-360:d.type==="state"?-220:-120))
  .force("collide",d3.forceCollide().radius(d=>radius(d)+6))
  .force("x",d3.forceX(0).strength(d=>hardDeg.get(d.id)?.04:.3)).force("y",d3.forceY(0).strength(d=>hardDeg.get(d.id)?.05:.3))
  .alphaDecay(.03).on("tick",render);
N.forEach(d=>{d.x=(Math.random()-.5)*60;d.y=(Math.random()-.5)*60;});

function linkPath(l){
  const s=l.source,t=l.target,dx=t.x-s.x,dy=t.y-s.y,dr=Math.hypot(dx,dy)*1.8;
  return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`;
}
const planPath=d=>`M${d.s.x},${d.s.y}L${d.t.x},${d.t.y}`;
function render(){ linkSel.attr("d",linkPath); planG.selectAll("path").attr("d",planPath); nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`); }

// drag
nodeSel.call(d3.drag()
  .on("start",(ev,d)=>{ if(view!=="net")return; if(!ev.active)sim.alphaTarget(.25).restart(); d.fx=d.x; d.fy=d.y; })
  .on("drag",(ev,d)=>{ if(view!=="net")return; d.fx=ev.x; d.fy=ev.y; })
  .on("end",(ev,d)=>{ if(view!=="net")return; if(!ev.active)sim.alphaTarget(0); d.fx=null; d.fy=null; }));

// zoom
const zoom=d3.zoom().scaleExtent([.3,4]).on("zoom",ev=>{root.attr("transform",ev.transform);svg.classed("zoomed",ev.transform.k>1.35);});
svg.call(zoom).on("dblclick.zoom",null);
function fit(dur=650){
  if(view==="3d"){ if(g3) g3.zoomToFit(dur+300,60,n=>focusNow?focusNow.has(n.id):isShown(n.ref)); return; }
  const vis=N.filter(isShown),xs=vis.map(d=>d.x),ys=vis.map(d=>d.y);
  if(!xs.length)return;
  W=stageEl.clientWidth;H=stageEl.clientHeight;
  if(!W||!H){setTimeout(()=>fit(dur),300);return;}          // stage not laid out yet: retry
  const x0=Math.min(...xs)-60,x1=Math.max(...xs)+60,y0=Math.min(...ys)-50,y1=Math.max(...ys)+70;
  const k=Math.min(2,.95*Math.min(W/(x1-x0),H/(y1-y0)));
  if(!isFinite(k)||k<=0)return;
  const t=d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k);
  if(reduce||document.hidden) svg.call(zoom.transform,t);    // no animation frames in background tabs
  else svg.transition().duration(dur).call(zoom.transform,t);
}

/* ---------- Year wheel layout ---------- */
const WHEEL_TYPES=new Set(["hub","season","festival","category","state","sale","signal"]);
const nodeVisible=d=>view!=="wheel"||WHEEL_TYPES.has(d.type);
const ang=m=>((m-1)/12)*2*Math.PI-Math.PI/2;
function circMean(ms){const x=d3.mean(ms,m=>Math.cos(ang(m))),y=d3.mean(ms,m=>Math.sin(ang(m)));return Math.atan2(y,x);}
function wheelTargets(){
  const R=300,T=new Map();
  T.set("india",{x:0,y:0});
  // seasons + sales: inner ring at their month centre
  N.filter(d=>d.type==="season").forEach(d=>{const a=circMean(d.months);const r=d.id==="peak"?R*.2:R*.36;T.set(d.id,{x:r*Math.cos(a),y:r*Math.sin(a)});});
  N.filter(d=>d.type==="sale").forEach((d,i)=>{const a=d.months.length?circMean(d.months):-Math.PI/2+i*.25;const r=d.months.length?R*.5:R*1.32;T.set(d.id,{x:r*Math.cos(a)+(i%2?14:-14),y:r*Math.sin(a)});});
  // categories: near the seasons that drive them
  let loose=0;
  N.filter(d=>d.type==="category").forEach(d=>{
    const ss=E.filter(l=>sid(l.target)===d.id&&l.rel==="drives sales of").map(l=>byId.get(sid(l.source)));
    const ms=ss.flatMap(s=>s.months);
    if(!ms.length){T.set(d.id,{x:-R*1.5,y:-R*.9+(loose++)*46});return;}   // year-round categories parked at the side
    d._a=circMean(ms);});
  const catGroups=d3.group(N.filter(d=>d.type==="category"&&d._a!==undefined),d=>d._a.toFixed(2));
  catGroups.forEach(arr=>arr.forEach((d,i)=>{const a=d._a+(i-(arr.length-1)/2)*.13;const r=R*(.58+(i%2)*.08);
    T.set(d.id,{x:r*Math.cos(a),y:r*Math.sin(a)});}));
  // festivals: ring by typical month, spread within the month
  const fests=N.filter(d=>d.type==="festival");
  const groups=d3.group(fests,d=>d.months.length?Math.round((circMean(d.months)+Math.PI/2+2*Math.PI)%(2*Math.PI)/(Math.PI/6)*2)/2:-1);
  groups.forEach((arr,key)=>arr.forEach((d,i)=>{
    if(key===-1){T.set(d.id,{x:R*1.25,y:R*1.05});return;}
    const step=Math.min(.11,.48/Math.max(1,arr.length-1));               // keep each month's festivals inside its slice
    const a=circMean(d.months)+(i-(arr.length-1)/2)*step;const r=R*(.8+(i%3)*.065);T.set(d.id,{x:r*Math.cos(a),y:r*Math.sin(a)});}));
  // states: outer ring, ordered by region, sized by share
  const states=N.filter(d=>d.type==="state").sort((a,b)=>["north","west","south","east"].indexOf(stateRegion(a.id).id)-["north","west","south","east"].indexOf(stateRegion(b.id).id)||pct(b.share)-pct(a.share));
  states.forEach((d,i)=>{const a=-Math.PI/2+(i+.5)/states.length*2*Math.PI;T.set(d.id,{x:R*1.22*Math.cos(a),y:R*1.22*Math.sin(a)});});
  return T;
}
function drawWheel(){
  const R=300;wheelG.selectAll("*").remove();
  [R*.36,R*.62,R*.88,R*1.22].forEach(r=>wheelG.append("circle").attr("r",r));
  wheelG.append("path").attr("class","wedge").attr("id","wedge");
  MON.forEach((m,i)=>{const a=ang(i+1);wheelG.append("text").attr("x",R*1.06*Math.cos(a)).attr("y",R*1.06*Math.sin(a)+4).text(m);});
  [["Seasons",R*.36],["Products",R*.62],["Festivals",R*.88],["States",R*1.22]].forEach(([t,r])=>wheelG.append("text").attr("class","ringlbl").attr("x",4).attr("y",-r-5).style("text-anchor","start").text(t));
  wheelG.append("line").attr("class","hand").attr("id","hand").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",-R*1.3).style("opacity",0);
}
drawWheel();
function setHand(m){
  const R=300,a=ang(m),a0=a-Math.PI/12,a1=a+Math.PI/12;
  const arc=d3.arc()({innerRadius:0,outerRadius:R*1.32,startAngle:a0+Math.PI/2,endAngle:a1+Math.PI/2});
  wheelG.select("#wedge").transition().duration(reduce?0:500).attr("d",arc);
  wheelG.select("#hand").style("opacity",.8).transition().duration(reduce?0:500).attr("x2",R*1.3*Math.cos(a)).attr("y2",R*1.3*Math.sin(a));
}

let view="net";
function setView(v){
  if(v===view)return; const was=view; view=v;
  ["net","wheel","3d"].forEach(x=>document.getElementById("v-"+x).setAttribute("aria-pressed",String(v===x)));
  const is3=v==="3d"; g3El.hidden=!is3; lab3.hidden=!is3; stageEl.style.visibility=is3?"hidden":"visible";
  if(is3){ sim.stop(); init3d(); size3d(); applyVisibility(); applyHighlight(); refresh3d(); return; }
  if(was==="3d"&&v==="net"){ sim.alpha(.3).restart(); applyVisibility(); applyHighlight(); setTimeout(()=>flowActive()?fitFlow():fit(),300); return; }
  if(v==="wheel"){
    sim.stop();
    const T=wheelTargets();
    N.forEach(d=>{d._x0=d.x;d._y0=d.y;const t=T.get(d.id)||{x:d.x,y:d.y};d._x1=t.x;d._y1=t.y;});
    tween(()=>{N.forEach(d=>{d.fx=d.x;d.fy=d.y;});fit(500);});
    wheelG.transition().duration(reduce?0:700).style("opacity",1);
  }else{
    N.forEach(d=>{d.fx=null;d.fy=null;});
    wheelG.transition().duration(reduce?0:300).style("opacity",0);
    sim.alpha(.9).restart(); setTimeout(()=>fit(),reduce?0:1400);
  }
  applyVisibility(); applyHighlight();
}
function tween(done){
  const ease=d3.easeCubicInOut,dur=reduce?1:1100;
  const t=d3.timer(el=>{const k=ease(Math.min(1,el/dur));
    N.forEach(d=>{d.x=d._x0+(d._x1-d._x0)*k;d.y=d._y0+(d._y1-d._y0)*k;}); render();
    if(el>=dur){t.stop();done&&done();}});
}

/* ---------- 3D view (3d-force-graph): same data, same controls, fly-through ---------- */
const g3El=document.getElementById("g3d"), lab3=document.getElementById("g3dLabels");
let g3=null, g3raf=null;
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function mix(hex,bg,t){ const p=h=>{h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
  try{const a=p(hex),b=p(bg);return "#"+a.map((v,i)=>Math.round(v*(1-t)+b[i]*t).toString(16).padStart(2,"0")).join("");}catch(_){return hex;} }
const nodes3=N.map(d=>({id:d.id,ref:d}));
const links3=E.map(l=>({source:sid(l.source),target:sid(l.target),ref:l}));
function hot3(l){ const a=sid(l.ref.source),b=sid(l.ref.target); return !!(focusNow&&focusNow.has(a)&&focusNow.has(b)&&a!=="india"&&b!=="india"); }
function init3d(){
  if(g3) return;
  if(typeof ForceGraph3D!=="function"){ g3El.innerHTML='<p class="empty" style="padding:24px">The 3D library could not load. Check your internet connection.</p>'; return; }
  g3=ForceGraph3D({controlType:"orbit"})(g3El)
    .backgroundColor(cssv("--bg"))
    .graphData({nodes:nodes3,links:links3})
    .nodeId("id")
    .nodeVal(n=>Math.max(1,(radius(n.ref)**2)/12))
    .nodeOpacity(.95).nodeResolution(14)
    .nodeLabel(n=>`<b>${esc(n.ref.label)}</b><br><span style="opacity:.75">${TYPES[n.ref.type][0]}${n.ref.share?` \u00b7 ${esc(n.ref.share)}`:""}</span>`)
    .linkWidth(l=>hot3(l)?1.6:.25)
    .linkOpacity(.35)
    .linkDirectionalParticles(l=>hot3(l)?3:0).linkDirectionalParticleWidth(2.2).linkDirectionalParticleSpeed(.006)
    .onNodeClick(n=>select(n.id,false))
    .onBackgroundClick(()=>{ if(selected) clearSel(); })
    .d3VelocityDecay(.35)
    .cooldownTicks(220);
  g3.d3Force("charge").strength(-60);
  try{ g3.controls().autoRotate=!reduce; g3.controls().autoRotateSpeed=.35; }catch(_){}
  g3El.addEventListener("pointerdown",()=>{ try{g3.controls().autoRotate=false;}catch(_){} });
  refresh3d(); size3d();
  g3.onEngineStop(()=>{ if(!selected) g3.zoomToFit(900,60); });
}
function size3d(){ if(!g3) return; const r=g3El.parentElement.getBoundingClientRect(); g3.width(r.width).height(r.height); }
addEventListener("resize",size3d);
function refresh3d(){
  if(!g3||view!=="3d") return;
  const bg=cssv("--bg"), acc=cssv("--accent"), edge=cssv("--edge");
  g3.backgroundColor(bg)
    .nodeVisibility(n=>isShown(n.ref))
    .linkVisibility(l=>linkShown(l.ref)||hot3(l))
    .nodeColor(n=>{ const c=cssv(TYPES[n.ref.type][1]); if(n.id===selected) return acc; return focusNow&&!focusNow.has(n.id)?mix(c,bg,.86):c; })
    .linkColor(l=>hot3(l)?acc:edge)
    .linkWidth(l=>hot3(l)?1.6:.25)
    .linkDirectionalParticles(l=>hot3(l)?3:0);
  labels3();
}
function labels3(){
  // HTML labels for the important things only, projected from 3D each frame
  const pick=nodes3.filter(n=>isShown(n.ref)&&(n.id===selected||(focusNow?focusNow.has(n.id)&&n.ref.type!=="signal":

              ...i.filter(l=>!skip.has(l.rel)).map(l=>`<div class="rel">${lnk(sid(l.source))} <span class="verb">${esc(l.rel)}</span> <b>${esc(d.label)}</b></div>`)];
  const srcTxt=d.src==="web"?"Source: web research":d.src?"Source: "+SRC[d.src]+(d.web?" + web research":""):"Summary node";
  detail.innerHTML=`<div class="d-type">${dot(d.type)}${TYPES[d.type][0]}</div><div class="d-name">${esc(d.label)}</div>${kpis}
    ${d.info?`<p class="d-info">${esc(d.info)}</p>`:""}<div class="d-src">${srcTxt} \u00b7 ${o.length+i.length} connections</div>
    ${brief}${sent.length?`<div class="sec"><h2>Other connections</h2><div class="rels">${sent.join("")}</div></div>`:""}`;
}
detail.addEventListener("click",ev=>{const b=ev.target.closest("[data-go]");if(b)select(b.dataset.go,true);});
detail.addEventListener("click",ev=>{
  if(!ev.target.closest("#copyCards"))return;
  const txt=JSON.stringify(lastCards,null,2), box=document.getElementById("copyBox"), btn=document.getElementById("copyCards");
  const fallback=()=>{box.hidden=false;box.value=txt;box.select();btn.textContent="Select-all and copy the text below";};
  try{ navigator.clipboard.writeText(txt).then(()=>{btn.textContent="Copied "+lastCards.length+" signals";},fallback); }catch(_){ fallback(); }
});

const overlay=document.getElementById("overlay");
const monList=ms=>ms.length?ms.map(m=>MON[m-1]).join("/"):"varies";
function boardHTML(m){
  const b=board(m), max=b[0].score||1, peak=byId.get("peak").months.includes(m);
  const sales=N.filter(d=>d.type==="sale"&&d.months.includes(m)).map(d=>d.label);
  const nat=N.filter(d=>d.type==="signal"&&d.national&&d.months.includes(m)).sort((a,b)=>b.str-a.str);
  return `<div class="d-type">Opportunity board</div><div class="d-name">${MON[m-1]}: where to sell, what to push</div>
    <p class="d-info">${peak?"Peak window: Aug to Dec brings 40 to 60% of the year's online spend. ":""}${sales.length?`Mega-sales running: ${sales.map(esc).join(", ")}. `:""}States are ranked by share of orders and how big their festivals are this month. Click a state for its plan.</p>
    <div class="board">${b.slice(0,15).map((p,i)=>`<button type="button" class="bd" data-go="${p.s.id}">
      <span class="rk">${i+1}</span><span class="bd-main"><span class="bd-top"><b>${esc(p.s.label)}</b><span class="mon">${p.known?esc(p.s.share)+" of orders":"share n/a"}</span></span>
      <span class="bar"><i style="width:${Math.max(4,p.score/max*100).toFixed(0)}%"></i></span>
      <span class="bd-why">${[...p.fs.map(x=>x.f.label),...p.sigs.filter(g=>!g.national&&g.dir>0).map(g=>g.label)].slice(0,4).map(esc).join(", ")||"No local festival or signal"}${p.pushes.length?` &rarr; push ${p.pushes.slice(0,3).map(x=>esc(byId.get(x.c).label)).join(", ")}`:""}</span></span></button>`).join("")}</div>
    <div class="note" style="margin-top:8px">Score = share of orders &times; (1 + festival weight + state-specific signals), &times;1.3 in the Aug to Dec peak. Festival weight: high 3, medium 2, low 1. States with no known share count as 0.6%. Festival months are typical dates.</div>
    ${nat.length?`<div class="sec" style="margin-top:12px"><h2>All-India signals this month</h2><div class="drivers">${[...d3.group(nat,x=>x.stype)].map(([t,arr])=>`<div><span class="k">${esc(SIGTYPE[t]||t)}:</span> ${arr.map(x=>`<button type="button" class="lnk" data-go="${x.id}">${esc(x.label)}</button>${x.dir<0?' <span class="pill hold">hold</span>':""}`).join(", ")}</div>`).join("")}</div></div>`:""}
    <div class="sec" style="margin-top:12px"><h2>Signal feed for the app</h2>${cardsHTML(b.slice(0,6).flatMap(p=>cardsFor(p,m,2,1)))}</div>`;
}
const lvl=v=>v>=8?"high":v>=4?"medium":"low";
function cardsFor(p,m,nFocus=4,nHold=3){
  const src=[...p.fs.filter(x=>x.meta&&x.meta.u).map(x=>x.meta.u),...p.sigs.filter(g=>g.url).map(g=>g.url)];
  return [...p.pushes.slice(0,nFocus).map(x=>({action:"FOCUS",state:p.s.label,month:MON[m-1],category:byId.get(x.c).label,
            because:x.why.slice(0,3).join(" + "),strength:lvl(x.v)})),
          ...p.holds.slice(0,nHold).map(x=>({action:"HOLD",state:p.s.label,month:MON[m-1],category:byId.get(x.c).label,
            because:x.why.slice(0,2).join(" + "),strength:lvl(x.v)}))]
    .map(c=>({...c,sources:[...new Set(src)].slice(0,4)}));
}
let lastCards=[];
function cardsHTML(cards){
  lastCards=cards;
  return `<div class="cards">${cards.map(c=>`<div class="sigcard ${c.action==="HOLD"?"hold":"focus"}"><span class="act">${c.action}</span>
      <span class="ct"><b>${esc(c.category)}</b> &middot; ${esc(c.state)} &middot; ${esc(c.month)} <span class="pill p${({high:3,medium:2,low:1})[c.strength]}">${c.strength}</span></span>
      <span class="cb">because ${esc(c.because)}</span></div>`).join("")}</div>
    <button type="button" class="btn copy" id="copyCards">Copy ${cards.length} signals as JSON</button><textarea class="copybox" id="copyBox" hidden readonly></textarea>`;
}
function driversHTML(p){
  const g=d3.group(p.sigs,x=>x.stype);
  if(!p.sigs.length) return "";
  return `<div class="drivers">${[...g].map(([t,arr])=>`<div><span class="k">${esc(SIGTYPE[t]||t)}:</span> ${arr.map(x=>
    `<button type="button" class="lnk" data-go="${x.id}">${esc(x.label)}</button>${x.dir<0?' <span class="pill hold">hold</span>':""}${x.national?' <span class="mon">all India</span>':""}`).join(", ")}</div>`).join("")}</div>`;
}
function planBox(d,m){
  const p=monthPlan(d.id,m), all=board(m), rank=all.findIndex(x=>x.s.id===d.id)+1;
  const ev=WEB.evidence.festival.filter(x=>x.states.includes(d.id)&&p.fs.some(f=>f.f.label.toLowerCase()===x.festival.toLowerCase()));
  return `<div class="brief plan"><h4>${MON[m-1]} plan &middot; rank ${rank} of ${all.length} states this month</h4>
    <div class="fg-b"><b>Local festivals:</b> ${p.fs.length?p.fs.map(x=>`${esc(x.f.label)} <span class="pill p${x.w}">${["","low","medium","high"][x.w]}</span>`).join(" "):"none this month."}</div>
    <div class="fg-b" style="margin-top:6px"><b>Other demand drivers this month</b></div>${driversHTML(p)||'<div class="fg-n">None recorded.</div>'}
    ${p.pushes.length?`<div class="fg-b" style="margin-top:8px"><b>Push, in order:</b></div><ol class="push">${p.pushes.map(x=>`<li><button type="button" class="lnk" data-go="${x.c}">${esc(byId.get(x.c).label)}</button> <span class="why">because of ${x.why.map(esc).join(" + ")}${x.watch?` &middot; <span class="watch">watch: ${x.watch.map(esc).join(", ")}</span>`:""}</span></li>`).join("")}</ol>`
      :`<div class="fg-b" style="margin-top:6px">Quiet month: no signal in the data. Keep always-on campaigns only.</div>`}
    ${p.holds.length?`<div class="fg-b"><b>Hold back:</b></div><ul class="push">${p.holds.slice(0,5).map(x=>`<li><b>${esc(byId.get(x.c).label)}</b> <span class="why">because of ${x.why.map(esc).join(" + ")}</span></li>`).join("")}</ul>`:""}
    ${p.fs.filter(x=>x.meta).map(x=>`<div class="fg-n"><b>${esc(x.f.label)}:</b> people buy ${esc(x.meta.b)}${x.meta.u?` &middot; <a href="${esc(x.meta.u)}" target="_blank" rel="noopener">source</a>`:""}</div>`).join("")}
    ${p.sigs.filter(g=>!g.national&&g.items).map(g=>`<div class="fg-n"><b>${esc(g.label)}:</b> ${esc(g.items)}${g.url?` &middot; <a href="${esc(g.url)}" target="_blank" rel="noopener">source</a>`:""}</div>`).join("")}
    ${ev.map(x=>`<div class="fg-n"><b>Evidence:</b> ${esc(x.fact)} &middot; <a href="${esc(x.src)}" target="_blank" rel="noopener">source</a></div>`).join("")}
    <div class="fg-b" style="margin-top:10px"><b>Signals for the app</b></div>${cardsHTML(cardsFor(p,m))}
  </div>`;
}
function selectionMonthCard(d,m){
  const seasons=seasonsIn(m).filter(s=>s.id!=="peak"), peak=byId.get("peak").months.includes(m);
  const pushes=[...new Set(seasons.flatMap(s=>catsOfSeason(s.id)))].map(c=>byId.get(c).label);
  if(d.type==="state"){
    const fs=festsOfState(d.id), now=fs.filter(f=>f.months.includes(m)), later=fs.filter(f=>!f.months.includes(m));
    const buys=now.map(f=>{const l=E.find(x=>sid(x.source)===f.id&&sid(x.target)===d.id&&x.rel==="is big in");return l&&l.meta?`${f.label}: ${l.meta.b}`:null;}).filter(Boolean);
    return `<h3>${esc(d.label)} \u00b7 ${MON[m-1]}${peak?" \u00b7 peak window":""}</h3>
      <div class="row"><span class="k">Festivals this month:</span> ${now.length?now.map(f=>esc(f.label)).join(", "):`none recorded for ${esc(d.label)}`}</div>
      ${buys.map(b=>`<div class="row"><span class="k">People buy:</span> ${esc(b)}</div>`).join("")}
      ${pushes.length?`<div class="row"><span class="k">National season pushes:</span> ${pushes.map(esc).join(", ")}</div>`:""}
      ${later.length?`<div class="row"><span class="k">Other months:</span> ${later.map(f=>`${esc(f.label)} (${monList(f.months)})`).join(", ")}</div>`:""}`;
  }
  const timed=TIMED.has(d.type);
  return `<h3>${esc(d.label)} \u00b7 ${MON[m-1]}</h3>
    ${timed?`<div class="row">${d.months.includes(m)?"Falls in this month.":`Not in ${MON[m-1]}; typical month: ${monList(d.months)}.`}</div>`:""}
    <div class="row"><span class="k">Showing only connections active in ${MON[m-1]}.</span> Click the month again to see everything.</div>`;
}
function showMonth(){
  if(!month||flowActive()){overlay.hidden=true;return;}   // the flow diagram already says it
  if(selected){ overlay.hidden=false; overlay.innerHTML=selectionMonthCard(byId.get(selected),month); return; }
  const b=monthBrief(month);
  overlay.hidden=false;
  overlay.innerHTML=`<h3>${MON[month-1]}${b.peak?" \u00b7 peak window":""}</h3>
    ${b.seasons.length?`<div class="row"><span class="k">Season:</span> ${b.seasons.map(s=>esc(s.label)).join(", ")}</div>`:""}
    ${b.fests.length?`<div class="row"><span class="k">Big festivals:</span> ${b.fests.filter(f=>f.impact===3).map(f=>esc(f.label)).join(", ")||"none high-impact"}${b.fests.filter(f=>f.impact<3).length?` <span class="k">+${b.fests.filter(f=>f.impact<3).length} regional</span>`:""}</div>`:`<div class="row"><span class="k">Festivals:</span> none recorded</div>`}
    ${b.cats.length?`<div class="row"><span class="k">Season pushes:</span> ${b.cats.map(esc).join(", ")}</div>`:""}
    ${b.buys.length?`<div class="row"><span class="k">Festival buys:</span> ${b.buys.map(esc).join(", ")}</div>`:""}
    ${b.sales.length?`<div class="row"><span class="k">Mega-sales:</span> ${b.sales.map(s=>esc(s.label)).join(", ")}</div>`:""}
    ${b.states.length?`<div class="row"><span class="k">Hot states:</span> ${b.states.slice(0,6).map(s=>esc(s.label)+(s.share?` (${s.share})`:"")).join(", ")}${b.states.length>6?` +${b.states.length-6}`:""}</div>`:""}`;
}

/* =========================================================================
   6. CONTROLS
   ========================================================================= */
function select(id,center){
  if(!byId.has(id))return;
  const d=byId.get(id);
  if(hiddenTypes.has(d.type)){hiddenTypes.delete(d.type);syncChips();applyVisibility();}
  if(d.type==="festival"&&hiddenImpact.has(d.impact)){hiddenImpact.delete(d.impact);syncImp();}
  if(!nodeVisible(d))setView("net");
  selected=id; stopPlay(); applyHighlight(); showDetail(); showMonth();
  if(view==="3d") fit(800);
  if(center&&!flowActive()){const t=d3.zoomTransform(stageEl);const k=Math.max(t.k,1.2);
    svg.transition().duration(reduce?0:600).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*d.x,H/2-k*d.y).scale(k));}
}
function clearSel(){selected=null;applyHighlight();showDetail();showMonth();if(view==="3d")fit();}
nodeSel.on("click",(ev,d)=>{ev.stopPropagation();select(d.id,false);})
  .on("keydown",(ev,d)=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(d.id,true);}});
svg.on("click",()=>clearSel());

const months=document.getElementById("months");
MON.forEach((m,i)=>{const b=document.createElement("button");b.type="button";b.className="month";b.id="m"+(i+1);b.textContent=m;b.setAttribute("aria-pressed","false");
  b.onclick=()=>{stopPlay();setMonth(month===i+1?null:i+1);};months.appendChild(b);});
function setMonth(m){
  month=m;   // keep the current selection: a state + a month shows that state's month
  months.querySelectorAll(".month").forEach((b,i)=>b.setAttribute("aria-pressed",String(i+1===m)));
  if(m&&view==="wheel")setHand(m); if(!m)wheelG.select("#hand").style("opacity",0);
  applyHighlight(); showDetail(); showMonth();
}
const playBtn=document.getElementById("playBtn");
function stopPlay(){if(playing){clearInterval(playing);playing=null;playBtn.innerHTML="&#9654; Play the year";}}
playBtn.onclick=()=>{
  if(playing){stopPlay();return;}
  if(view==="net")setView("wheel");
  let m=7; // start in August: the run-up to the peak
  playBtn.innerHTML="&#10073;&#10073; Pause";
  const step=()=>{m=m%12+1;setMonth(m);};
  step(); playing=setInterval(step,reduce?2600:1900);
};
document.getElementById("v-net").onclick=()=>{stopPlay();setView("net");};
document.getElementById("v-wheel").onclick=()=>setView("wheel");
document.getElementById("v-3d").onclick=()=>{stopPlay();setView("3d");};
document.getElementById("fit").onclick=()=>flowActive()?fitFlow():fit();
document.getElementById("clear").onclick=()=>{stopPlay();setMonth(null);clearSel();};

/* ---------- State bar (all states, largest share first) ---------- */
const stateBar=document.getElementById("states");
N.filter(d=>d.type==="state").sort((a,b)=>pct(b.share)-pct(a.share)||a.label.localeCompare(b.label)).forEach(d=>{
  const b=document.createElement("button");b.type="button";b.className="st";b.id="st-"+d.id;b.dataset.s=d.id;b.setAttribute("aria-pressed","false");
  b.innerHTML=`${esc(d.label)}${d.share?`<span class="sh">${esc(d.share)}</span>`:""}`;
  b.onclick=()=>{ if(selected===d.id) clearSel(); else select(d.id,true); };
  stateBar.appendChild(b);
});
function syncStates(){
  const lit=month&&!selected?monthActive(month):null;
  stateBar.querySelectorAll(".st").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.s===selected));b.classList.toggle("lit",!!(lit&&lit.has(b.dataset.s)));});
  const on=stateBar.querySelector('.st[aria-pressed="true"]');
  if(on) on.scrollIntoView({block:"nearest",inline:"center",behavior:reduce?"auto":"smooth"});
}

const chips=document.getElementById("chips");
const counts=d3.rollup(N,v=>v.length,d=>d.type);
Object.entries(TYPES).forEach(([k,[name,tok]])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.id="chip-"+k;b.dataset.t=k;
  b.innerHTML=`<span class="dot" style="background:var(${tok})"></span>${name}<span class="n">${counts.get(k)}</span>`;
  b.onclick=()=>{hiddenTypes.has(k)?hiddenTypes.delete(k):hiddenTypes.add(k);syncChips();applyVisibility();if(selected&&hiddenTypes.has(byId.get(selected).type))clearSel();};
  chips.appendChild(b);});
function syncChips(){chips.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(!hiddenTypes.has(b.dataset.t))));}
syncChips();

/* ---------- Festival impact filter ---------- */
const impChips=document.getElementById("impChips");
const impCounts=d3.rollup(N.filter(d=>d.type==="festival"),v=>v.length,d=>d.impact);
[[3,"High"],[2,"Medium"],[1,"Low"]].forEach(([v,name])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.id="imp-"+v;b.dataset.v=v;
  b.innerHTML=`<span class="pill p${v}" style="margin:0">${name}</span><span class="n">${impCounts.get(v)||0}</span>`;
  b.onclick=()=>{hiddenImpact.has(v)?hiddenImpact.delete(v):hiddenImpact.add(v);syncImp();
    if(selected){const s=byId.get(selected);if(s.type==="festival"&&hiddenImpact.has(s.impact))clearSel();}};
  impChips.appendChild(b);});
function syncImp(){impChips.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(!hiddenImpact.has(+b.dataset.v))));applyVisibility();}
syncImp();

/* ---------- Market evidence (web research, with sources) ---------- */
document.getElementById("evidence").innerHTML=WEB.evidence.national.map(x=>`<div class="e">${esc(x.fact)}
  <div class="who">${esc(x.who)} \u00b7 ${esc(x.date)} \u00b7 <a href="${esc(x.src)}" target="_blank" rel="noopener">source</a></div></div>`).join("");

const dl=document.getElementById("names");
[...N].sort((a,b)=>a.label.localeCompare(b.label)).forEach(d=>{const o=document.createElement("option");o.value=d.label;dl.appendChild(o);});
const search=document.getElementById("search");
const doSearch=()=>{const v=search.value.trim().toLowerCase();if(!v)return;const h=N.find(d=>d.label.toLowerCase()===v)||N.find(d=>d.label.toLowerCase().includes(v));if(h)select(h.id,true);};
search.addEventListener("change",doSearch);search.addEventListener("keydown",ev=>{if(ev.key==="Enter")doSearch();});

/* ---------- Insights (all computed from the data) ---------- */
(function insights(){
  const ranked=N.filter(d=>d.type==="state"&&d.share).sort((a,b)=>pct(b.share)-pct(a.share));
  const top3=ranked.slice(0,3),top3sum=d3.sum(top3,d=>pct(d.share));
  const diwaliN=statesOfFest("diwali").length;
  const perMonth=MON.map((_,i)=>N.filter(d=>d.type==="festival"&&d.months.includes(i+1)).length);
  const best=perMonth.indexOf(Math.max(...perMonth));
  const local=N.filter(d=>d.type==="festival"&&d.impact===3&&statesOfFest(d.id).length<=2)
    .map(d=>`${d.label} (${statesOfFest(d.id).map(s=>byId.get(s).label).join(", ")})`);
  const stateN=N.filter(d=>d.type==="state").length, festN=N.filter(d=>d.type==="festival").length;
  const cards=[
    [`${top3sum}%`,`of orders come from ${top3.map(d=>d.label).join(", ")}. Start budget allocation here.`,"Computed from notes","maharashtra"],
    ["40\u201360%","of yearly e-commerce spend lands in Aug\u2013Dec. Most of the year's budget belongs in this window.","From notes","peak"],
    [`${diwaliN} of ${stateN}`,"states and UTs list Diwali as a key festival: the closest thing to a national moment.","Notes + web research","diwali"],
    [`${local.length} local peaks`,`High-impact festivals that matter in only one or two states: ${local.slice(0,6).join("; ")}. A national calendar misses these.`,"Computed from web research","onam"],
    [`${festN} festivals`,`mapped across ${stateN} states and UTs, each linked to what people buy. Use the impact filter to focus on the big ones.`,"Notes + web research","sankranti"],
    [`${MON[best]}`,`has the most festivals (${perMonth[best]}). Expect the most competition for ads and the highest costs.`,"Computed, typical dates","main"],
    ["Mar\u2013Apr","is the second window: Ugadi, Gudi Padwa, Vishu plus ACs and refrigerators before summer.","From notes","summer"]
  ];
  document.getElementById("insights").innerHTML=cards.map(([b,t,tag,go])=>`<div class="card"><div class="big">${esc(b)}</div><div class="txt">${esc(t)}</div>
    <div class="tag">${esc(tag)} \u00b7 <button type="button" class="lnk" data-go="${go}">show</button></div></div>`).join("");
  document.getElementById("insights").addEventListener("click",ev=>{const b=ev.target.closest("[data-go]");if(b)select(b.dataset.go,true);});
})();

document.getElementById("meta").textContent=`${N.length} things \u00b7 ${E.length} links`;
applyVisibility(); applyHighlight(); showDetail();
// The full graph takes a few seconds to spread out: keep re-framing it until the viewer takes over.
let userMoved=false;
zoom.on("start.user",ev=>{ if(ev.sourceEvent) userMoved=true; });
const autoFit=()=>{ if(!userMoved&&!selected&&!month&&view==="net") fit(900); };
[1800,4500,8000].forEach(t=>setTimeout(autoFit,reduce?50:t));
sim.on("end.fit",autoFit);
addEventListener("resize",()=>{W=stageEl.clientWidth;H=stageEl.clientHeight;});
</script>
